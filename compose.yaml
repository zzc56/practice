services:
  zhixu:
    build: .
    ports:
      - "8080:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      DATA_DIR: /app/data
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      BASE_PATH: "${BASE_PATH:-}"
      INVITE_CODE: "${INVITE_CODE:-}"
      # 前面挂了 Nginx/Cloudflare 等反向代理时设为 "true"，才能拿到访客真实 IP 用于限流与日志
      TRUSTED_PROXY: "${TRUSTED_PROXY:-false}"
    volumes:
      - zhixu-data:/app/data
    restart: unless-stopped

volumes:
  zhixu-data:
